<html>
    <body>
        <h1>main dashboard</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <h2>Your Games</h2>

        <ul>
        {% for game in games %}
            <li>{{ game[0] }}</li>
        {% endfor %}
        </ul>

    </body>
</html>
